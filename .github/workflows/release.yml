name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux-standard:
    name: x86_64-unknown-linux-gnu
    runs-on: ubuntu-22.04
    env:
      BUNDLE_ID: x86_64-unknown-linux-gnu
      TARBALL_SUFFIX: ""
    steps:
      - uses: actions/checkout@v4

      - name: Match tag and Cargo.toml version
        shell: bash
        run: |
          REF="${GITHUB_REF_NAME#v}"
          VER=$(grep '^version = ' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [[ "$REF" != "$VER" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME must match package version in Cargo.toml ($VER)"
            exit 1
          fi

      - name: Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libvulkan-dev vulkan-tools build-essential pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: release-${{ env.BUNDLE_ID }}

      - name: Build metadata for spacetravlr --version
        shell: bash
        run: |
          echo "SPACETRAVLR_GIT_SHA=${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"

      - name: Cargo build
        run: cargo --config 'build.rustc-wrapper=""' build --release --locked --features spatial-viewer

      - name: Package tarball and checksum
        shell: bash
        env:
          TARGET: x86_64-unknown-linux-gnu
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          TAR="spacetravlr-${VERSION}-${TARGET}${TARBALL_SUFFIX}.tar.gz"
          mkdir -p pack
          cp target/release/spacetravlr target/release/spacetravlr-perturb target/release/spatial_viewer pack/
          tar -czvf "$TAR" -C pack spacetravlr spacetravlr-perturb spatial_viewer
          sha256sum "$TAR" | awk -v f="$(basename "$TAR")" '{print $1 "  " f}' > "checksum-${BUNDLE_ID}.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ env.BUNDLE_ID }}
          path: |
            spacetravlr-*.tar.gz
            checksum-*.txt

  build-linux-compat:
    name: x86_64-unknown-linux-gnu-glibc2.31
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    env:
      BUNDLE_ID: x86_64-unknown-linux-gnu-glibc2.31
      TARBALL_SUFFIX: "-glibc2.31"
      DEBIAN_FRONTEND: noninteractive
      TZ: Etc/UTC
    steps:
      - name: Container OS packages
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates cmake curl git build-essential pkg-config libvulkan-dev vulkan-tools zlib1g-dev

      - uses: actions/checkout@v4

      - name: Match tag and Cargo.toml version
        shell: bash
        run: |
          REF="${GITHUB_REF_NAME#v}"
          VER=$(grep '^version = ' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [[ "$REF" != "$VER" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME must match package version in Cargo.toml ($VER)"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: release-${{ env.BUNDLE_ID }}

      - name: Build metadata for spacetravlr --version
        shell: bash
        run: |
          echo "SPACETRAVLR_GIT_SHA=${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"

      - name: Cargo build
        run: cargo --config 'build.rustc-wrapper=""' build --release --locked --features spatial-viewer

      - name: Package tarball and checksum
        shell: bash
        env:
          TARGET: x86_64-unknown-linux-gnu
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          TAR="spacetravlr-${VERSION}-${TARGET}${TARBALL_SUFFIX}.tar.gz"
          mkdir -p pack
          cp target/release/spacetravlr target/release/spacetravlr-perturb target/release/spatial_viewer pack/
          tar -czvf "$TAR" -C pack spacetravlr spacetravlr-perturb spatial_viewer
          sha256sum "$TAR" | awk -v f="$(basename "$TAR")" '{print $1 "  " f}' > "checksum-${BUNDLE_ID}.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ env.BUNDLE_ID }}
          path: |
            spacetravlr-*.tar.gz
            checksum-*.txt

  build-macos:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - name: Match tag and Cargo.toml version
        shell: bash
        run: |
          REF="${GITHUB_REF_NAME#v}"
          VER=$(grep '^version = ' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [[ "$REF" != "$VER" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME must match package version in Cargo.toml ($VER)"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: release-${{ matrix.target }}

      - name: Build metadata for spacetravlr --version
        shell: bash
        run: |
          echo "SPACETRAVLR_GIT_SHA=${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"

      - name: Cargo build
        run: cargo --config 'build.rustc-wrapper=""' build --release --locked --features spatial-viewer

      - name: Package tarball and checksum
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          TAR="spacetravlr-${VERSION}-${TARGET}.tar.gz"
          mkdir -p pack
          cp target/release/spacetravlr target/release/spacetravlr-perturb target/release/spatial_viewer pack/
          tar -czvf "$TAR" -C pack spacetravlr spacetravlr-perturb spatial_viewer
          shasum -a 256 "$TAR" | awk -v f="$(basename "$TAR")" '{print $1 "  " f}' > "checksum-${TARGET}.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.target }}
          path: |
            spacetravlr-*.tar.gz
            checksum-*.txt

  publish:
    name: GitHub Release
    needs:
      - build-linux-standard
      - build-linux-compat
      - build-macos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: bundle-*
          merge-multiple: true

      - name: Merge SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cat artifacts/checksum-*.txt > SHA256SUMS
          cp SHA256SUMS artifacts/

      - uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
