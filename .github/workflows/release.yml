name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: write

env:
  CARGO_TERM_COLOR: always

jobs:
  resolve-platforms:
    name: Resolve release platforms
    runs-on: ubuntu-latest
    outputs:
      linux_standard: ${{ steps.parse.outputs.linux_standard }}
      linux_compat: ${{ steps.parse.outputs.linux_compat }}
      linux_glibc228: ${{ steps.parse.outputs.linux_glibc228 }}
      macos: ${{ steps.parse.outputs.macos }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse release-platforms from tag annotation
        id: parse
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          PLATFORMS=""
          if git rev-parse "$TAG^{tag}" >/dev/null 2>&1; then
            BODY="$(git tag -l "$TAG" --format='%(contents:body)')"
            PLATFORMS="$(printf '%s\n' "$BODY" | sed -n 's/^[Rr]elease-platforms:[[:space:]]*//p' | head -1 | tr -d '[:space:]')"
          fi
          if [[ -z "$PLATFORMS" ]]; then
            echo "No release-platforms line in tag; building all platforms."
            echo "linux_standard=true" >> "$GITHUB_OUTPUT"
            echo "linux_compat=true" >> "$GITHUB_OUTPUT"
            echo "linux_glibc228=true" >> "$GITHUB_OUTPUT"
            echo "macos=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Building subset from tag: $PLATFORMS"
          IFS=',' read -ra IDS <<< "$PLATFORMS"
          linux_standard=false
          linux_compat=false
          linux_glibc228=false
          macos=false
          for id in "${IDS[@]}"; do
            case "$id" in
              x86_64-unknown-linux-gnu) linux_standard=true ;;
              x86_64-unknown-linux-gnu-glibc2.31) linux_compat=true ;;
              x86_64-unknown-linux-gnu-glibc2.28) linux_glibc228=true ;;
              aarch64-apple-darwin) macos=true ;;
              *)
                echo "::error::Unknown platform id in release-platforms: $id"
                exit 1
                ;;
            esac
          done
          if [[ "$linux_standard" == false && "$linux_compat" == false && "$linux_glibc228" == false && "$macos" == false ]]; then
            echo "::error::release-platforms was set but no known platform ids were found"
            exit 1
          fi
          echo "linux_standard=$linux_standard" >> "$GITHUB_OUTPUT"
          echo "linux_compat=$linux_compat" >> "$GITHUB_OUTPUT"
          echo "linux_glibc228=$linux_glibc228" >> "$GITHUB_OUTPUT"
          echo "macos=$macos" >> "$GITHUB_OUTPUT"

  build-linux-standard:
    name: x86_64-unknown-linux-gnu
    needs: resolve-platforms
    if: needs.resolve-platforms.outputs.linux_standard == 'true'
    runs-on: ubuntu-22.04
    env:
      BUNDLE_ID: x86_64-unknown-linux-gnu
      TARBALL_SUFFIX: ""
    steps:
      - uses: actions/checkout@v4

      - name: Match tag and Cargo.toml version
        shell: bash
        run: |
          REF="${GITHUB_REF_NAME#v}"
          VER=$(grep '^version = ' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [[ "$REF" != "$VER" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME must match package version in Cargo.toml ($VER)"
            exit 1
          fi

      - name: Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libvulkan-dev vulkan-tools build-essential pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: release-${{ env.BUNDLE_ID }}

      - name: Build metadata for spacetravlr --version
        shell: bash
        run: |
          echo "SPACETRAVLR_GIT_SHA=${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"

      - name: Cargo build
        run: cargo --config 'build.rustc-wrapper=""' build --release --locked --features spatial-viewer

      - name: Package tarball and checksum
        shell: bash
        env:
          TARGET: x86_64-unknown-linux-gnu
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          TAR="spacetravlr-${VERSION}-${TARGET}${TARBALL_SUFFIX}.tar.gz"
          mkdir -p pack
          cp target/release/spacetravlr target/release/spacetravlr-perturb target/release/spatial_viewer pack/
          tar -czvf "$TAR" -C pack spacetravlr spacetravlr-perturb spatial_viewer
          sha256sum "$TAR" | awk -v f="$(basename "$TAR")" '{print $1 "  " f}' > "checksum-${BUNDLE_ID}.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ env.BUNDLE_ID }}
          path: |
            spacetravlr-*.tar.gz
            checksum-*.txt

  build-linux-compat:
    name: x86_64-unknown-linux-gnu-glibc2.31
    needs: resolve-platforms
    if: needs.resolve-platforms.outputs.linux_compat == 'true'
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    env:
      BUNDLE_ID: x86_64-unknown-linux-gnu-glibc2.31
      TARBALL_SUFFIX: "-glibc2.31"
      DEBIAN_FRONTEND: noninteractive
      TZ: Etc/UTC
    steps:
      - name: Container OS packages
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential pkg-config libvulkan-dev vulkan-tools zlib1g-dev

      - name: Install CMake 3.28+ (focal ships 3.16; libz-sys / zlib build scripts require ≥3.18)
        shell: bash
        run: |
          set -euo pipefail
          CMAKE_VER=3.28.6
          curl -sSL "https://github.com/Kitware/CMake/releases/download/v${CMAKE_VER}/cmake-${CMAKE_VER}-linux-x86_64.tar.gz" -o /tmp/cmake.tgz
          tar -xzf /tmp/cmake.tgz -C /opt
          echo "/opt/cmake-${CMAKE_VER}-linux-x86_64/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@v4

      - name: Match tag and Cargo.toml version
        shell: bash
        run: |
          REF="${GITHUB_REF_NAME#v}"
          VER=$(grep '^version = ' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [[ "$REF" != "$VER" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME must match package version in Cargo.toml ($VER)"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: release-${{ env.BUNDLE_ID }}

      - name: Build metadata for spacetravlr --version
        shell: bash
        run: |
          echo "SPACETRAVLR_GIT_SHA=${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"

      - name: Cargo build
        run: cargo --config 'build.rustc-wrapper=""' build --release --locked --features spatial-viewer

      - name: Package tarball and checksum
        shell: bash
        env:
          TARGET: x86_64-unknown-linux-gnu
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          TAR="spacetravlr-${VERSION}-${TARGET}${TARBALL_SUFFIX}.tar.gz"
          mkdir -p pack
          cp target/release/spacetravlr target/release/spacetravlr-perturb target/release/spatial_viewer pack/
          tar -czvf "$TAR" -C pack spacetravlr spacetravlr-perturb spatial_viewer
          sha256sum "$TAR" | awk -v f="$(basename "$TAR")" '{print $1 "  " f}' > "checksum-${BUNDLE_ID}.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ env.BUNDLE_ID }}
          path: |
            spacetravlr-*.tar.gz
            checksum-*.txt

  build-linux-glibc228:
    name: x86_64-unknown-linux-gnu-glibc2.28
    needs: resolve-platforms
    if: needs.resolve-platforms.outputs.linux_glibc228 == 'true'
    runs-on: ubuntu-latest
    container: debian:buster-slim
    env:
      BUNDLE_ID: x86_64-unknown-linux-gnu-glibc2.28
      TARBALL_SUFFIX: "-glibc2.28"
      DEBIAN_FRONTEND: noninteractive
      TZ: Etc/UTC
    steps:
      - name: Container OS packages
        shell: bash
        run: |
          set -euo pipefail
          sed -i -e 's/deb.debian.org/archive.debian.org/g' \
                 -e 's|security.debian.org|archive.debian.org|g' \
                 -e '/buster-updates/d' /etc/apt/sources.list
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential pkg-config libvulkan-dev vulkan-tools zlib1g-dev

      - name: Install CMake 3.28+ (buster ships 3.13; libz-sys / zlib build scripts require ≥3.18)
        shell: bash
        run: |
          set -euo pipefail
          CMAKE_VER=3.28.6
          curl -sSL "https://github.com/Kitware/CMake/releases/download/v${CMAKE_VER}/cmake-${CMAKE_VER}-linux-x86_64.tar.gz" -o /tmp/cmake.tgz
          tar -xzf /tmp/cmake.tgz -C /opt
          echo "/opt/cmake-${CMAKE_VER}-linux-x86_64/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@v4

      - name: Match tag and Cargo.toml version
        shell: bash
        run: |
          REF="${GITHUB_REF_NAME#v}"
          VER=$(grep '^version = ' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [[ "$REF" != "$VER" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME must match package version in Cargo.toml ($VER)"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: release-${{ env.BUNDLE_ID }}

      - name: Build metadata for spacetravlr --version
        shell: bash
        run: |
          echo "SPACETRAVLR_GIT_SHA=${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"

      - name: Cargo build
        run: cargo --config 'build.rustc-wrapper=""' build --release --locked --features spatial-viewer

      - name: Package tarball and checksum
        shell: bash
        env:
          TARGET: x86_64-unknown-linux-gnu
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          TAR="spacetravlr-${VERSION}-${TARGET}${TARBALL_SUFFIX}.tar.gz"
          mkdir -p pack
          cp target/release/spacetravlr target/release/spacetravlr-perturb target/release/spatial_viewer pack/
          tar -czvf "$TAR" -C pack spacetravlr spacetravlr-perturb spatial_viewer
          sha256sum "$TAR" | awk -v f="$(basename "$TAR")" '{print $1 "  " f}' > "checksum-${BUNDLE_ID}.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ env.BUNDLE_ID }}
          path: |
            spacetravlr-*.tar.gz
            checksum-*.txt

  build-macos:
    name: aarch64-apple-darwin
    needs: resolve-platforms
    if: needs.resolve-platforms.outputs.macos == 'true'
    runs-on: macos-14
    env:
      BUNDLE_ID: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - name: Match tag and Cargo.toml version
        shell: bash
        run: |
          REF="${GITHUB_REF_NAME#v}"
          VER=$(grep '^version = ' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [[ "$REF" != "$VER" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME must match package version in Cargo.toml ($VER)"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: release-${{ env.BUNDLE_ID }}

      - name: Build metadata for spacetravlr --version
        shell: bash
        run: |
          echo "SPACETRAVLR_GIT_SHA=${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"

      - name: Cargo build
        run: cargo --config 'build.rustc-wrapper=""' build --release --locked --features spatial-viewer

      - name: Package tarball and checksum
        shell: bash
        env:
          TARGET: aarch64-apple-darwin
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          TAR="spacetravlr-${VERSION}-${TARGET}.tar.gz"
          mkdir -p pack
          cp target/release/spacetravlr target/release/spacetravlr-perturb target/release/spatial_viewer pack/
          tar -czvf "$TAR" -C pack spacetravlr spacetravlr-perturb spatial_viewer
          shasum -a 256 "$TAR" | awk -v f="$(basename "$TAR")" '{print $1 "  " f}' > "checksum-${BUNDLE_ID}.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ env.BUNDLE_ID }}
          path: |
            spacetravlr-*.tar.gz
            checksum-*.txt

  publish:
    name: GitHub Release
    needs:
      - resolve-platforms
      - build-linux-standard
      - build-linux-compat
      - build-linux-glibc228
      - build-macos
    if: ${{ always() && needs.resolve-platforms.result == 'success' && !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: bundle-*
          merge-multiple: true

      - name: Merge SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cat artifacts/checksum-*.txt > SHA256SUMS
          cp SHA256SUMS artifacts/

      - uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
