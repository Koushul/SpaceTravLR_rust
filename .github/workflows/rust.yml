name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  actions: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: spacetravlr binary compile env (env! in spacetravlr.rs)
        run: |
          echo "SPACETRAVLR_GIT_SHA=${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"
          echo "SPACETRAVLR_TARGET_TRIPLE=$(rustc -vV | awk '/host:/ {print $2}')" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2

      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install OpenBLAS (LAPACK dgesdd for PCA)
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev

      - name: Build
        run: cargo --config 'build.rustc-wrapper=""' build

      - name: Run tests
        run: cargo --config 'build.rustc-wrapper=""' test

  install-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck scripts/install.sh

      - name: bats
        run: |
          sudo apt-get install -y bats
          bats scripts/install.bats
