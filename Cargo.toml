[workspace]
members = [
    ".",
    "celloracle",
    "crates/enrichr",
    "crates/rctd-core",
    "crates/spacetravlr-rctd",
]
resolver = "2"

[package]
name = "spacetravlr"
version = "2.6.1"
edition = "2024"
description = "Spatial gene regulatory network inference and in-silico perturbation (Rust port of SpaceTravLR)"
readme = "README.md"
repository = "https://github.com/Koushul/SpaceTravLR_rust"
homepage = "https://github.com/Koushul/SpaceTravLR_rust"
documentation = "https://docs.rs/spacetravlr"
license = "MIT"
keywords = ["spatial", "transcriptomics", "grn", "single-cell", "machine-learning"]
categories = ["science", "command-line-utilities"]
rust-version = "1.86"
build = "build.rs"
exclude = [
    ".agent/",
    ".agents/",
    ".claude/",
    ".cursor/",
    "skills-lock.json",
    ".github/",
    ".vscode/",
    "results/",
    "data/",
    "tmp_dir/",
    "web/",
    "genes_human_mouse.csv.xz",
]
default-run = "spacetravlr"
autobins = false

[package.metadata.cargo-llvm-cov]
ignore-filename-regex = ["/\\.cargo/registry/", "/\\.cargo/git/"]

[profile.dev]
incremental = true

[profile.release]
lto = "thin"
codegen-units = 1

[features]
default = ["tui", "self-update", "rctd"]
tui = [
    "dep:ratatui",
    "dep:ratatui-themes",
    "dep:crossterm",
    "dep:sysinfo",
    "dep:unicode-width",
    "dep:tokio",
]
dev-main = []
spatial-viewer = [
    "dep:axum",
    "dep:tokio",
    "dep:tower-http",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:foyer",
    "dep:bincode",
    "dep:blake3",
    "dep:tempfile",
]
umap-lab = [
    "dep:axum",
    "dep:tokio",
    "dep:tower-http",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:tempfile",
]
self-update = [
    "dep:ureq",
    "dep:tar",
    "dep:sha2",
    "dep:semver",
]
rctd = ["dep:spacetravlr-rctd"]
rctd-wgpu = ["rctd", "spacetravlr-rctd/wgpu"]

[[bin]]
name = "spacetravlr"
path = "src/bin/spacetravlr.rs"

[[bin]]
name = "spacetravlr-perturb"
path = "src/bin/spacetravlr_perturb.rs"

[[bin]]
name = "spacetravlr-dev"
path = "src/main.rs"
required-features = ["dev-main"]

[[bin]]
name = "spatial_viewer"
path = "src/bin/spatial_viewer.rs"
required-features = ["spatial-viewer"]

[[bin]]
name = "umap_lab"
path = "src/bin/umap_lab.rs"
required-features = ["umap-lab"]

[[bin]]
name = "cnn_train_bench"
path = "src/bin/cnn_train_bench.rs"

[dependencies]
burn = { version = "0.16.1", features = ["wgpu", "train", "ndarray"] }
burn-autodiff = { version = "0.16.1" }
pollster = "0.4"
wgpu = "23.0"
ndarray = { version = "0.16", features = ["rayon"] }
rayon = "1.10"
rand = "0.8"
rand_distr = "0.4"
rand_chacha = "0.3"
approx = "0.5"
indicatif = { version = "0.17", features = ["rayon"] }
anndata = "0.6"
anndata-hdf5 = "0.5"
polars = { version = "0.51", default-features = false, features = [
    "lazy",
    "ndarray",
    "parquet",
    "csv",
    "ipc",
    "decompress",
    "strings",
    "temporal",
    "fmt",
    "zip_with",
    "dtype-categorical",
] }
anyhow = "1.0"
clap = { version = "4.5", features = ["color", "derive", "wrap_help"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
ndarray-npy = { version = "0.9", features = ["npz", "compressed_npz"] }
polars-utils = "0.51"
ratatui = { version = "0.30", optional = true }
ratatui-themes = { version = "0.2.0", optional = true }
crossterm = { version = "0.29", optional = true }
sysinfo = { version = "0.32", optional = true }
unicode-width = { version = "0.2", optional = true }
build_html = "2.7"
serde_json = "1"
chrono = "0.4"
glob = "0.3"
hdf5-metno = "0.10.1"
flate2 = "1"
nalgebra = { version = "0.33", default-features = false, features = ["std"] }
nalgebra-sparse = "0.11"
kiddo = ">=5.2, <5.3"
single_rust = "0.5.8"
single_algebra = "0.9"
single-utilities = { version = "0.9", features = ["convert"] }
anndata-memory = "1.0"
umap-rs = "0.4.5"
instant-distance = "0.6.1"
sprs = "0.11.4"
ndarray_umap = { package = "ndarray", version = "0.17", features = ["rayon"] }
magic-impute = { git = "https://github.com/Koushul/MAGIC", package = "magic-impute", rev = "07d13a3c02345a03da2d6f0a0acd93834179c567" }
leiden = { git = "https://github.com/Koushul/MAGIC", package = "leiden", rev = "07d13a3c02345a03da2d6f0a0acd93834179c567" }
axum = { version = "0.8", optional = true, default-features = false, features = [
    "json",
    "query",
    "macros",
    "tokio",
    "http1",
] }
tokio = { version = "1", optional = true, features = [
    "rt-multi-thread",
    "macros",
    "net",
    "signal",
    "sync",
    "time",
] }
tower-http = { version = "0.6", optional = true, features = [
    "cors",
    "fs",
    "trace",
    "compression-gzip",
] }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", optional = true, features = ["env-filter"] }
foyer = { version = "0.22.3", optional = true, features = ["serde"] }
bincode = { version = "2", optional = true, features = ["serde"] }
blake3 = { version = "1.5", optional = true }
tempfile = { version = "3", optional = true }
ureq = { version = "2.12", optional = true, default-features = true, features = ["json"] }
tar = { version = "0.4", optional = true }
sha2 = { version = "0.10", optional = true }
semver = { version = "1", optional = true }
spacetravlr-rctd = { path = "crates/spacetravlr-rctd", optional = true, default-features = false }
colored = "2.2"
termplot-rs = "0.3.0"
terminal_size = "0.3"
statrs = "0.18"
fs4 = "0.13"

[dev-dependencies]
approx = "0.5"
anndata = "0.6"
anndata-hdf5 = "0.5"
anndata-memory = "1.0"
burn = { version = "0.16.1", features = ["ndarray", "train"] }
burn-autodiff = { version = "0.16.1" }
ndarray = "0.16"
rand = "0.8"
rand_chacha = "0.3"
rand_distr = "0.4"
polars = { version = "0.51", default-features = false, features = ["ipc", "parquet"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
statrs = "0.18"

# Use vendored anndata default WriteConfig: gzip (deflate) instead of Zstd→Blosc so Python
# h5py/Scanpy on arm64 can read our .h5ad without a Blosc HDF5 plugin.
[patch.crates-io]
anndata = { path = "vendor/anndata" }
umap-rs = { path = "patches/umap-rs" }
linfa = { path = "patches/linfa" }
