# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  SpaceTravLR — Spaceship Config                                            ║
# ║  All training hyperparameters in one place.                                ║
# ║  CLI flags (--epochs, --parallel, etc.) override values here.              ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

[data]
# Path to .h5ad dataset. Leave empty for interactive prompt (TUI) or pass --h5ad.
# adata_path      = "/Users/koush/Projects/jishnulab/SpaceTravLR/tutorial/ThePerturbedBrain/slideseq_brain_processed.h5ad"
# Expression layer to read from AnnData
layer           = "imputed_count"
# obs column holding integer cluster labels
cluster_annot   = "cell_type"
# Optional: split training by this obs column (e.g. treatment, batch).
# condition      = "batch"
# Optional: one obs_names value per line; perturbation loads only those cells (smaller RAM; ROI-only GRN).
# perturb_obs_subset_file = "roi_obs_names.txt"

[spatial]
# Radius for spatial neighbor detection
radius           = 300
# Grid resolution for spatial convolution kernel
spatial_dim      = 64
# Distance threshold for contact-based signaling
contact_distance = 30
# Linear scale on Gaussian weights in received-ligand aggregation
weighted_ligand_scale_factor = 1.0

[grn]
# Optional: directory with mouse_network.parquet / human_network.parquet (overrides SPACETRAVLR_DATA_DIR).
# network_data_dir = "/path/to/your/data"
# Optional: Feather/IPC TF priors with columns: source, target, cell_type.
# If omitted and use_tf_modulators is true, training writes celloracle_tf_priors.feather in the output dir.
# tf_priors_feather = "/Users/koush/Projects/jishnulab/SpaceTravLR/tutorial/SlideTagsKidney/xenium_skin_links.feather"
# Minimum score for a TF to be included as a ligand-mediated regulator
tf_ligand_cutoff = 0.1
# Max p-value for CellOracle Bayesian ridge edges to enter the TF priors feather (default 0.05).
celloracle_p_max = 0.05
max_lr = 200
use_tf_modulators = true
use_lr_modulators = true
use_tfl_modulators = true
# Shorthand (overwrites the three flags when set): comma-separated tf, lr, tfl (alias ltf). Example LR-only ablation:
# train_modulators = "tf,lr"
# extra_modulators = ["GENE1", "GENE2"]
# extra_modulators_file = "path/to/extra_genes.txt"
# extra_lr = ["LIG1$REC1"]
# extra_lr_file = "path/to/extra_lr.txt"

[cnn]
# Adam hyperparameters (CNN fine-tuning when seed_only = false)
adam_beta_1 = 0.9
adam_beta_2 = 0.999
adam_epsilon = 1e-5
# Optional L2 on CNN parameters (omit = off)
# weight_decay = 1e-5
# Clip gradient L2 norm each step (default in code: 3.0; set null to disable)
# grad_clip_norm = 3.0
# Radius passed to create_spatial_features for CNN inputs (coordinate units)
spatial_feature_radius = 300.0
# After final head linear, before lasso-anchor scaling: identity | sigmoid | tanh | sigmoidx2 (2·sigmoid, (0,2))
output_activation = "sigmoidx2"
# Per-optimizer-step batch size over cells within a cluster (0 = full batch per epoch)
cnn_minibatch_size = 512
# Weak prior: MSE between batch-mean effective betas and Lasso anchors (default in code ~1e-3–1e-2 range; keeps mean near Lasso while allowing per-cell spatial variation)
# mean_beta_lasso_prior_weight = 0.005
# LR schedule: constant | cosine (cosine decays to learning_rate * cosine_lr_min_ratio after optional warmup)
# lr_schedule = "cosine"
# cosine_lr_min_ratio = 0.01
# lr_warmup_epochs = 0
# Early stop on train MSE if no improvement for cnn_early_stop_patience epochs (after cnn_early_stop_min_epochs)
# cnn_early_stop_patience = 8
# cnn_early_stop_min_epochs = 12
# Optional Lasso prediction alignment: MSE(y_pred, y_lasso); use small weight; linear_decay ramps weight down over epochs
lasso_pred_align_weight = 0.05
lasso_pred_align_linear_decay = true
# If CNN in-sample R² is worse than Lasso, drop CNN for that cluster (export uses Lasso); margin relaxes the comparison
drop_cnn_if_insample_worse_than_lasso = true
# cnn_vs_lasso_arbitration_margin = 0.0

[lasso]
# Element-wise L1 penalty
l1_reg    = 1e-5
# Group-L2 penalty
group_reg = 1e-7
# Max FISTA iterations
n_iter    = 500
# Relative convergence tolerance
tol       = 1e-4
# Column-wise scaling of modulator features (divide by std, no mean subtraction).
# Matches CellOracle StandardScaler(with_mean=false). Default true.
scale_modulators = true
# When scale_modulators is true, divide exported betas by column std (original expression units).
# Set false to export scaled-space betas (CellOracle-style). Default true.
unscale_betas_on_export = false

[training]
# Default when omitted: seed. Use full or hybrid to enable CNN paths.
mode            = "seed"
epochs          = 50
# Learning rate for CNN Adam (see [cnn] for beta/epsilon/decay/clip)
learning_rate   = 2e-4
# Minimum mean lasso R² to allow CNN in hybrid mode (also used when hybrid.min_mean_lasso_r2_for_cnn is unset)
score_threshold = 0.1
# Optional target subset (CLI: --genes / --max-genes). Persisted in spacetravlr_run_repro.toml for --join-output-dir.
# genes = ["GENE1", "GENE2"]
# max_genes = 500



[execution]
# Number of parallel gene-training workers
n_parallel  = 9
# Directory for *_betadata.feather. Leave empty to use cwd/{adata_stem}_YYYY-MM-DD (local date).
# output_dir = "/path/to/custom_run"
# Write spacetravlr_minimal_repro.h5ad (slow / large I/O on big datasets). Default false; or pass --write-minimal-repro-h5ad.
# write_minimal_repro_h5ad = true
# Multi-host training: if > 0, delete gene *.lock files older than this many seconds before claiming (crash recovery on NFS). Default 0 = never.
# stale_lock_secs = 14400

[perturbation]
# Multiplier applied to all betas in splash()
beta_scale_factor = 1.0
# Clamp betas to [-cap, cap] after scaling (comment out or omit for no cap)
# beta_cap        = 10.0
# Number of signal propagation rounds
n_propagation     = 4
# Approximate received ligands using a spatial grid for faster perturbation.
# Value is grid_spacing / radius (smaller = more accurate, larger = faster).
#   0.5 → ~3% error, ~12x faster at 5000+ cells
#   0.3 → ~1% error, ~6x faster
# Comment out or omit for exact O(N²) computation.
# ligand_grid_factor = 0.2
# Optional defaults for `spacetravlr-perturb` (--export / TUI) when --cells-csv is omitted; paths relative to the run TOML’s directory unless absolute.
# cells_csv = "cell_scope.csv"
# cells_csv_column = "my_cells"

[model_export]
# Export CNN weights (.npz) for genes that run per-cell CNN refinement (omit or false = off).
save_cnn_weights = false
# Write {gene}_cnn_train_data.npz + {gene}_cnn_train_meta.json for scripts/python_train_cnn.py (same tensors as Rust; no SPACETRAVLR_DUMP_CNN_TRAIN_DATA). CLI: --write-cnn-train-data-npz
# write_cnn_train_data_npz = false
# Use compressed .npz (numpy savez_compressed format).
compressed_npz = true
# Subdirectory under [execution].output_dir for CNN .npz exports
output_subdir = "CNN_weights"

# Hybrid gating (only when mode = "hybrid"); see src/cnn_gating.rs / log gate_* fields
[training.hybrid]
min_cells_per_cluster_for_cnn = 80
max_modulators_soft_for_cnn = 600
moran_k_neighbors = 8
moran_permutations = 99
moran_p_value_max = 0.05
moran_p_value_max_when_over_modulator_cap = 0.01
require_all_clusters_lasso_converged = true
# min_mean_lasso_r2_for_cnn = 0.15
# min_mean_target_expression_for_cnn = 0.01
hybrid_modulator_spatial_weight = 1.0
# 0 = stricter gates (fewer CNNs), 1 = looser; 0.5 matches pre-knob behavior (default if omitted)
hybrid_cnn_permissiveness = 1
# cnn_force_genes_file = "path/to/allow.txt"
# cnn_skip_genes_file = "path/to/skip.txt"
# hybrid_cnn_top_k = 50
