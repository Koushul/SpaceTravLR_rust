site_name: SpaceTravLR
site_description: Characterizing Functional Microniches
# Canonical URL on Read the Docs (READTHEDOCS_CANONICAL_URL); local fallback for mkdocs serve / CI.
site_url: !ENV [READTHEDOCS_CANONICAL_URL, 'http://127.0.0.1:8000/']
repo_url: https://github.com/Koushul/SpaceTravLR_rust
repo_name: SpaceTravLR_rust
edit_uri: edit/main/docs/
copyright: >-
  © 2026, Koushul &amp; Ally @
  <a href="https://jishnulab.org" target="_blank" rel="noopener">jishnulab.org</a>
  <span class="st-footer-sheep" aria-hidden="true">🐑&#xfe0f;🐑&#xfe0f;</span>

docs_dir: docs
site_dir: site

validation:
  links:
    not_found: ignore

theme:
  name: material
  favicon: assets/favicon.svg
  icon:
    logo: material/rocket
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: pink
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Dark (Rosé Pine)
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: purple
      accent: pink
      toggle:
        icon: material/brightness-4
        name: Light
  features:
    - navigation.instant
    - navigation.tracking
    - search.suggest
    - content.code.copy

plugins:
  - search
  - mkdocs-jupyter:
      execute: false
      include_source: true

markdown_extensions:
  - attr_list
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css
  - stylesheets/rose-pine.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Koushul/SpaceTravLR_rust

nav:
  - Overview: index.md

  - Installation: install.md

  - Usage: usage.md

  - Parameters: params.md

  - How it works: math.md

  - Output: output.md

  - Validation:
    - CCR4 Knockout: ccr4.md
    - CCR5 Knockout: ccr5.md
    - Spatial Perturbseq: validation.md

  - Tutorials:
      # - Find Functional Microniches: tutorials/find-functional-microniches.ipynb
      - Perturb Genes Spatially: tutorials/perturb-genes-spatially.ipynb
      - Screen Ligand-Receptors: tutorials/screen-ligand-receptors.ipynb


  - Examples:
    - Atera:
      - Cervical Cancer (Human): examples/atera-cervical-cancer-human.md
      - Breast Cancer (Human): examples/atera-breast-cancer-human.md
    - Xenium:
      - Skin (Mouse): examples/xenium-skin-mouse.md
      - Small Intestine (Mouse): examples/xenium-small-intestine-mouse.md
    - VisiumHD:
      - Lymph Node (Mouse): examples/visiumhd-lymph-node-mouse.md
      - Small Intestine (Mouse): examples/visiumhd-small-intestine-mouse.md
      - Kidney (Mouse): examples/visiumhd-kidney-mouse.md
    - XYZeqv2:
      - Kidney (Mouse): examples/xyzeqv2-kidney-mouse.md
      - Liver (Mouse): examples/xyzeqv2-liver-mouse.md
      - MC38 Tumor (Mouse): examples/xyzeqv2-mc38-tumor-mouse.md
    - SlideTags:
      - Tonsil (Human): examples/slidetags-tonsil-human.md
      - Melanoma (Human): examples/slidetags-melanoma-human.md
      - Kidney (Mouse): examples/slidetags-kidney-mouse.md
    - Stereoseq:
      - Liver (Mouse): examples/stereoseq-liver-mouse.md
      - Kidney (Mouse): examples/stereoseq-kidney-mouse.md
      - Hippocampus (Mouse): examples/stereoseq-hippocampus-mouse.md
    - SlideSeqv2:
      - Lymph Node (Mouse): examples/slideseqv2-lymph-node-mouse.md
      - Hippocampus (Mouse): examples/slideseqv2-hippocampus-mouse.md
      - Embryo (Mouse): examples/slideseqv2-embryo-mouse.md
    - Merfish:
      - Liver (Mouse): examples/merfish-liver-mouse.md
