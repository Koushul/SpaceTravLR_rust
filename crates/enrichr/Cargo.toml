[package]
name = "enrichr"
version = "0.1.0"
edition = "2024"
description = "Blocking HTTP client for the Maayan Lab Enrichr REST API"
license = "MIT"
repository = "https://github.com/Koushul/SpaceTravLR_rust"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ureq = { version = "2.12", default-features = true, features = ["json"] }
urlencoding = "2"

[dev-dependencies]
serde_json = "1"
