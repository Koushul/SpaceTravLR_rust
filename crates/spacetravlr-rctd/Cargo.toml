[package]
name = "spacetravlr-rctd"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "RCTD CLI helpers for spacetravlr (h5ad load, Q-matrices, deconvolution)"

[features]
default = []
wgpu = ["rctd-core/wgpu"]

[dependencies]
rctd-core = { path = "../rctd-core" }
anyhow = "1"
ndarray = "0.16"
anndata = "0.6"
anndata-hdf5 = "0.5"
polars = { version = "0.51", default-features = false, features = ["dtype-full", "strings"] }
nalgebra-sparse = "0.11"
rand = "0.8"
ureq = { version = "2", default-features = true }
dirs-next = "2"
indicatif = { version = "0.17", features = ["rayon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
