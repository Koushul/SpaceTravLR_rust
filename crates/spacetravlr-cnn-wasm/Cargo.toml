[package]
name = "spacetravlr-cnn-wasm"
version = "0.1.0"
edition = "2024"
description = "Browser WASM CellularNicheNetwork CNN trainer for SpaceTravLR (WebGPU with NdArray fallback)"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "webgpu_smoke"
path = "src/bin/webgpu_smoke.rs"
required-features = ["webgpu"]

[features]
default = ["wasm"]
wasm = [
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:serde-wasm-bindgen",
    "dep:console_error_panic_hook",
    "dep:js-sys",
]
# Native GPU smoke (`webgpu_smoke` bin) + compile wgpu_init helpers off-wasm.
webgpu = []

[dependencies]
burn = { version = "0.16.1", default-features = false, features = ["std", "ndarray", "autodiff", "wgpu"] }
burn-autodiff = { version = "0.16.1" }
ndarray = { version = "0.16", default-features = false, features = ["std"] }
rand = { version = "0.8", default-features = false, features = ["std", "std_rng"] }
rand_chacha = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = { version = "1.3" }

wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
js-sys = { version = "0.3", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
js-sys = { version = "0.3" }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
