[package]
name = "spacetravlr-cnn-wasm"
version = "0.1.0"
edition = "2024"
description = "Browser WASM CellularNicheNetwork CNN trainer for SpaceTravLR"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["wasm"]
wasm = ["dep:wasm-bindgen", "dep:serde-wasm-bindgen", "dep:console_error_panic_hook", "dep:js-sys"]

[dependencies]
burn = { version = "0.16.1", default-features = false, features = ["std", "ndarray", "autodiff"] }
burn-autodiff = { version = "0.16.1" }
ndarray = { version = "0.16", default-features = false, features = ["std"] }
rand = { version = "0.8", default-features = false, features = ["std", "std_rng"] }
rand_chacha = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = { version = "1.3" }

wasm-bindgen = { version = "0.2", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
js-sys = { version = "0.3", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
js-sys = { version = "0.3" }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
