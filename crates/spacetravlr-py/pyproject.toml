[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "spacetravlr-quiver"
version = "0.1.0"
description = "Rust-backed UMAP transition / quiver fields for SpaceTravLR (velocyto/Cartography parity)"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "matplotlib>=3.7",
  "seaborn>=0.13",
  "anndata>=0.10",
  "pyarrow>=14",
  "pandas>=2",
]

[project.optional-dependencies]
umap = ["umap-learn>=0.5", "scikit-learn>=1.3"]
dev = ["pytest>=7", "maturin>=1.7"]

[tool.maturin]
manifest-path = "Cargo.toml"
module-name = "spacetravlr_quiver._lib"
python-source = "../../python"
features = ["pyo3/extension-module"]
