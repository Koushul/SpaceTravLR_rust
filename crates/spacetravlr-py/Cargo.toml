[package]
name = "spacetravlr-py"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "PyO3 bindings for SpaceTravLR UMAP transition / quiver fields"
publish = false

[lib]
name = "spacetravlr_quiver"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.24", features = ["extension-module"] }
numpy = "0.24"
ndarray = "0.16"
spacetravlr-transition = { path = "../spacetravlr-transition" }
