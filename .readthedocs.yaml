# Read the Docs — https://docs.readthedocs.com/platform/stable/intro/mkdocs.html
# Must live at the repository root on branch `main` (this repo has no `master` branch).
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    pre_install:
      - pip install -r docs/requirements.txt

mkdocs:
  configuration: mkdocs.yml
