[data]
layer = "imputed_count"
cluster_annot = "cell_type_int"
adata_path = "/ix/djishnu/shared/djishnu_kor11/training_data_revision/snrna_human_tonsil.h5ad"

[spatial]
radius = 200
spatial_dim = 32
contact_distance = 50
weighted_ligand_scale_factor = 1.0

[grn]
tf_ligand_cutoff = 0.15
network_data_dir = "/ix1/ylee/kor11/tools/SpaceTravLR_rust/data"
use_tf_modulators = true
use_lr_modulators = false
use_tfl_modulators = false
max_ligands = 40
tf_priors_feather = "/ix1/ylee/kor11/tools/SpaceTravLR_rust/experiments/il21_bcl6_ablation/runs/tf_only__seed/celloracle_tf_priors.feather"

[cnn]
adam_beta_1 = 0.9
adam_beta_2 = 0.999
adam_epsilon = 1e-5
spatial_feature_radius = 200.0
output_activation = "sigmoidx2"

[lasso]
l1_reg = 1e-9
group_reg = 1e-9
n_iter = 100
tol = 0.0001
scale_modulators = false
unscale_betas_on_export = false

[training]
mode = "seed"
epochs = 3
learning_rate = 0.0002
score_threshold = 0.1
genes = [ "IL21", "BCL6",]

[execution]
n_parallel = 4
output_dir = "/ix1/ylee/kor11/tools/SpaceTravLR_rust/experiments/il21_bcl6_ablation/runs/tf_only__seed"

[perturbation]
beta_scale_factor = 1.0
n_propagation = 4
ligand_grid_factor = 0.5

[model_export]
save_cnn_weights = false
compressed_npz = true
output_subdir = "CNN_weights"

[training.hybrid]
min_cells_per_cluster_for_cnn = 80
max_modulators_soft_for_cnn = 600
moran_k_neighbors = 8
moran_permutations = 99
moran_p_value_max = 0.05
moran_p_value_max_when_over_modulator_cap = 0.01
require_all_clusters_lasso_converged = true
hybrid_modulator_spatial_weight = 1.0
hybrid_cnn_permissiveness = 1
